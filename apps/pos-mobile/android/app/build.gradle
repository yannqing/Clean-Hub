apply plugin: 'com.android.application'

def envOrProperty = { String name ->
    if (project.hasProperty(name)) {
        return project.property(name)
    }

    return System.getenv(name)
}

def androidVersionCode = (envOrProperty('CLEANHUB_POS_BUILD_NUMBER') ?: envOrProperty('CLEANHUB_ANDROID_VERSION_CODE') ?: '1') as Integer
def androidVersionName = envOrProperty('CLEANHUB_POS_VERSION') ?: envOrProperty('CLEANHUB_ANDROID_VERSION_NAME') ?: '0.1.0'
def releaseKeystorePath = envOrProperty('CLEANHUB_ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = envOrProperty('CLEANHUB_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = envOrProperty('CLEANHUB_ANDROID_KEY_ALIAS')
def releaseKeyPassword = envOrProperty('CLEANHUB_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.cleanhub.pos"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        aidl = true
    }
    defaultConfig {
        applicationId "com.cleanhub.pos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersionCode
        versionName androidVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.zxing:core:3.5.4"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def validatePosProductionConfig = tasks.register('validatePosProductionConfig', Exec) {
    group = 'verification'
    description = 'Rejects release builds containing development or offline POS configuration.'
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/validate-native-release.mjs', 'android'
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure {
        dependsOn validatePosProductionConfig
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
