<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanHub POS 工单管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { brand: "#2563EB", brandDark: "#1D4ED8", ink: "#0F172A", page: "#F7F9FC" },
            boxShadow: { panel: "0 1px 2px rgba(15,23,42,.04)", focus: "0 0 0 4px rgba(37,99,235,.10)", drawer: "-20px 0 50px rgba(15,23,42,.16)" }
          }
        }
      };
    </script>
    <style>
      body { font-family: Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; }
      .brand-gradient { background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #8b5cf6 100%); }
      .scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
      .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
      .scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
      input[type="datetime-local"]::-webkit-calendar-picker-indicator { opacity: .55; }
    </style>
  </head>
  <body class="bg-page text-ink">
    <div id="root"></div>
    <script>window.__cleanHubRoot = ReactDOM.createRoot(document.getElementById("root"));</script>
    <script src="./assets/tickets-app.js"></script>
  </body>
</html>
