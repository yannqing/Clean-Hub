name: Release POS APK

# Builds, signs and publishes the Android POS as a downloadable APK.
#
# Run it from the Actions tab ("Run workflow"), or by pushing a tag such as
# pos-v1.0.0. A tag build takes its version from the tag name so the artifact,
# the release and the installed app all agree.
#
# The APK is signed with a keystore held in repository secrets. That keystore
# must never change once users have installed a build from it: Android refuses
# an update signed by a different key, and the only way out is uninstalling,
# which destroys the terminal's local data and any sale still queued offline.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown to users, e.g. 1.0.0"
        required: true
        type: string
      build_number:
        description: "versionCode. Must be higher than every previous release."
        required: true
        type: string
      publish_release:
        description: "Attach the APK to a GitHub Release"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "pos-v*"

concurrency:
  group: release-pos-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version and build number
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
            build_number="$INPUT_BUILD_NUMBER"
          else
            # pos-v1.2.3 -> 1.2.3. The run number is monotonic per repository,
            # which is what versionCode needs; a hand-picked number on a tag
            # build risks silently reusing one and producing an APK that
            # existing terminals refuse to install.
            version="${REF_NAME#pos-v}"
            build_number="${GITHUB_RUN_NUMBER}"
          fi

          case "$version" in
            ""|*[!0-9.]*)
              echo "Version must contain only digits and dots; got '$version'." >&2
              exit 1
              ;;
          esac
          case "$build_number" in
            ""|*[!0-9]*)
              echo "Build number must be a positive integer; got '$build_number'." >&2
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building CleanHub POS $version ($build_number)."

      - name: Verify required secrets are present
        env:
          API_BASE_URL: ${{ secrets.POS_API_BASE_URL }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${API_BASE_URL:-}" ] && missing="$missing POS_API_BASE_URL"
          [ -z "${KEYSTORE_BASE64:-}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${KEYSTORE_PASSWORD:-}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${KEY_ALIAS:-}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${KEY_PASSWORD:-}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "Add them under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          # Fail here rather than deep inside Gradle: the app refuses a
          # non-HTTPS or loopback origin at release validation anyway, and the
          # message is clearer from this distance.
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "POS_API_BASE_URL must be an https:// origin; got '$API_BASE_URL'." >&2; exit 1 ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default still asks sdkmanager for the retired `tools`
          # package. Platform tools are the only SDK package required here;
          # Gradle resolves the compile platform from the Android project.
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/pos-mobile/android/**/*.gradle', 'apps/pos-mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the native POS still matches the server rules
        run: pnpm check:native-pos-parity

      - name: Synchronize Android Capacitor plugins
        run: pnpm --filter @cleanhub/pos-mobile cap:sync:android

      - name: Run Android unit tests
        working-directory: apps/pos-mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Outside the workspace so no later step can archive it by accident.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "ANDROID_KEYSTORE_BASE64 did not decode to a keystore file." >&2
            exit 1
          fi

      - name: Package signed APK and AAB
        env:
          CLEANHUB_POS_RUNTIME: production
          CLEANHUB_POS_API_BASE_URL: ${{ secrets.POS_API_BASE_URL }}
          CLEANHUB_POS_ALLOW_CLEARTEXT: "false"
          CLEANHUB_POS_VERSION: ${{ steps.version.outputs.version }}
          CLEANHUB_POS_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          CLEANHUB_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CLEANHUB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLEANHUB_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLEANHUB_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm --filter @cleanhub/pos-mobile package:android

      - name: Verify the APK is signed and correctly configured
        env:
          API_BASE_URL: ${{ secrets.POS_API_BASE_URL }}
        run: |
          set -euo pipefail
          apk=$(find release/pos-mobile/android -name '*.apk' ! -name '*-debug.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi

          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          # An unsigned APK installs on nobody's phone; the build gradle now
          # fails first, but verify the artifact itself rather than trusting it.
          "$build_tools/apksigner" verify --print-certs "$apk"

          # Dump once: aapt2 on a 17MB APK is not free, and `grep` inside an
          # `if` must not be the last command of a `set -e` script.
          manifest=$("$build_tools/aapt2" dump xmltree "$apk" --file AndroidManifest.xml)

          # A debuggable release would let anyone attach to a running till.
          if printf '%s' "$manifest" | grep -q 'debuggable'; then
            echo "The release APK is debuggable." >&2
            exit 1
          fi
          if ! printf '%s' "$manifest" | grep -q 'usesCleartextTraffic.*=false'; then
            echo "The release APK does not disable cleartext traffic." >&2
            exit 1
          fi

          # The API origin is compiled into BuildConfig. A build that lost it
          # installs fine and then cannot reach anything.
          work=$(mktemp -d)
          unzip -oq "$apk" 'classes*.dex' -d "$work"
          host=${API_BASE_URL#https://}
          host=${host%%/*}
          if ! grep -rqa "$host" "$work"; then
            echo "The APK does not contain the configured API origin ($host)." >&2
            exit 1
          fi
          rm -rf "$work"

          echo "APK verified: $apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Summarise the build
        env:
          API_BASE_URL: ${{ secrets.POS_API_BASE_URL }}
        run: |
          set -euo pipefail
          {
            echo "### CleanHub POS ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build_number }})"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| API origin | \`$API_BASE_URL\` |"
            echo "| Minimum Android | 7.0 (API 24) |"
            echo
            echo "| Artifact | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in release/pos-mobile/android/*.apk release/pos-mobile/android/*.aab; do
              [ -e "$f" ] || continue
              printf '| %s | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanhub-pos-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}
          path: release/pos-mobile/android/*
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('pos-v{0}', steps.version.outputs.version) }}
          name: CleanHub POS ${{ steps.version.outputs.version }}
          files: release/pos-mobile/android/*
          fail_on_unmatched_files: true
          body: |
            CleanHub POS for Android — version ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build_number }}).

            **Installing**

            Download the `.apk` below and open it on the terminal. Android asks
            for permission to install apps from this source the first time;
            allow it and the install continues.

            Requires Android 7.0 or newer.

            The `.aab` is for Google Play only and cannot be installed directly.

            Verify the download against the SHA-256 checksums in the build
            summary for this release.
